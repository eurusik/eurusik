name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Install Docker CLI
        run: |
          curl -fsSL https://get.docker.com | sh
          export DOCKER_HOST=tcp://host.docker.internal:2375
          docker version || true

      - name: Build and Push
        env:
          DOCKER_HOST: tcp://172.17.0.1:2375
        run: |
          docker build -t git.lab.home/eurusik/eurusik.tech:latest .
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login git.lab.home --username ${{ secrets.REGISTRY_USER }} --password-stdin
          docker push git.lab.home/eurusik/eurusik.tech:latest
