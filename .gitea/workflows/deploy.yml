name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Install Docker CLI
        run: apt-get update -qq && apt-get install -y -qq docker.io > /dev/null 2>&1

      - name: Build and Push Docker image
        env:
          DOCKER_HOST: tcp://172.17.0.1:2375
        run: |
          docker build -t git.lab.home/eurusik/eurusik.tech:latest .
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login git.lab.home --username ${{ secrets.REGISTRY_USER }} --password-stdin
          docker push git.lab.home/eurusik/eurusik.tech:latest

      - name: Deploy to cluster
        run: |
          curl -fsSL https://dl.k8s.io/release/v1.31.0/bin/linux/arm64/kubectl -o /usr/local/bin/kubectl
          chmod +x /usr/local/bin/kubectl
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > /tmp/kubeconfig
          KUBECONFIG=/tmp/kubeconfig kubectl rollout restart deployment/eurusik-app -n eurusik-app
          KUBECONFIG=/tmp/kubeconfig kubectl rollout status deployment/eurusik-app -n eurusik-app --timeout=120s
