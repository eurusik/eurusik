name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Install Docker CLI
        run: apt-get update -qq && apt-get install -y -qq docker.io > /dev/null 2>&1

      - name: Build and Push Docker image
        env:
          DOCKER_HOST: tcp://172.17.0.1:2375
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE=git.lab.home/eurusik/eurusik.tech
          docker build -t ${IMAGE}:${SHORT_SHA} -t ${IMAGE}:latest .
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login git.lab.home --username ${{ secrets.REGISTRY_USER }} --password-stdin
          docker push ${IMAGE}:${SHORT_SHA}
          docker push ${IMAGE}:latest || true

      - name: Update homelab manifests for ArgoCD
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          git clone http://${{ secrets.REGISTRY_USER }}:${{ secrets.REGISTRY_PASSWORD }}@git.lab.home/eurusik/homelab.git /tmp/homelab
          cd /tmp/homelab
          sed -i "s|image: git.lab.home/eurusik/eurusik.tech:.*|image: git.lab.home/eurusik/eurusik.tech:${SHORT_SHA}|" apps/eurusik-app/deployment.yaml
          git config user.name "gitea-ci[bot]"
          git config user.email "ci@lab.home"
          git add apps/eurusik-app/deployment.yaml
          git diff --cached --quiet || git commit -m "deploy(eurusik-app): update image to ${SHORT_SHA}"
          git push || true
