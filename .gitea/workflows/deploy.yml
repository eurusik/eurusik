name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Prepare Docker context
        run: tar -czf /tmp/context.tar.gz .

      - name: Build and Push with Kaniko
        uses: docker://gcr.io/kaniko-project/executor:v1.23.2-debug
        with:
          args: >-
            --context=tar:///tmp/context.tar.gz
            --dockerfile=Dockerfile
            --destination=git.lab.home/eurusik/eurusik.tech:latest
            --insecure
            --skip-tls-verify
