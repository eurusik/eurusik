name: Build and Deploy

on:
  push:
    branches: [main]

env:
  DOCKER_HOST: tcp://localhost:2375

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:dind
        options: --privileged
        env:
          DOCKER_TLS_CERTDIR: ""
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Wait for Docker
        run: |
          for i in $(seq 1 30); do
            docker version && break || sleep 2
          done

      - name: Build Docker image
        run: docker build -t git.lab.home/eurusik/eurusik.tech:latest .

      - name: Push to Registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login git.lab.home --username ${{ secrets.REGISTRY_USER }} --password-stdin
          docker push git.lab.home/eurusik/eurusik.tech:latest
